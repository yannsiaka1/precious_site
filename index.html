    <!--
      Données structurées : elles permettent à Google d'afficher le commerce
      avec ses coordonnées et ses réseaux, plutôt qu'un simple lien bleu.
      À compléter avec l'adresse exacte le jour où elle est arrêtée.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FoodEstablishment",
        "name": "Precious",
        "description": "Jus naturels, donuts artisanaux et cocktails sans alcool sur mesure pour vos événements, à Montréal. Formations et guide.",
        "url": "https://precious-jus.com/",
        "image": "https://precious-jus.com/assets/og-precious.jpg",
        "email": "Preciousck384@gmail.com",
        "telephone": "+1-514-977-2775",
        "servesCuisine": "Boissons naturelles, donuts",
        "priceRange": "$$",
        "areaServed": { "@type": "City", "name": "Montréal" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Montréal",
          "addressRegion": "QC",
          "addressCountry": "CA"
        },
        "sameAs": [
          "https://www.facebook.com/share/1BwKsN7ovA/",
          "https://www.tiktok.com/@precious100bio"
        ]
      }
    </script>

    <noscript>
      <style>
        /* Sans JavaScript, les apparitions au scroll ne se déclenchent pas :
           on affiche tout d'emblée plutôt que de laisser la page vide. */
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
