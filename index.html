<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>

    </title>
    <meta
      name="description"
      content="Jus naturels pressés, cocktails et mocktails sans alcool pour mariages, galas et événements corporatifs à Montréal, donuts artisanaux, et formations en présentiel ou en ligne. Bar à jus Precious, service événementiel sur mesure."
    />

    <!-- Partage sur les réseaux et les messageries -->

    <meta property="og:site_name" content="Precious" />

      property="og:title"
      content="Precious — Jus naturels, donuts et cocktails événementiels"
    />

      property="og:description"
      content="Bar à jus, cocktails et mocktails sans alcool pour vos événements à Montréal. Jus naturels pressés, donuts artisanaux et formations professionnelles."
    />

    <meta property="og:image" content="https://precious-jus.com/assets/og-precious.jpg" />

    <link rel="preload" href="/fonts/cinzel-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cinzel-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bellefair-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      Données structurées : elles permettent à Google d'afficher le commerce
      avec ses coordonnées et ses réseaux, plutôt qu'un simple lien bleu.
      À compléter avec l'adresse exacte le jour où elle est arrêtée.
    -->
    <!--
      Données structurées.

      Deux blocs : l'établissement lui-même, et les deux formations décrites
      comme des cours avec leur tarif. Google peut ainsi afficher les
      coordonnées du commerce et faire ressortir les formations sur des
      recherches de type « formation cocktails Montréal ».

      Rien n'est déclaré ici qui ne figure pas sur la page. Aucune note ni
      aucun avis n'est balisé : Google ignore les avis qu'un site publie sur
      lui-même, et les inventer exposerait la marque.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "FoodEstablishment",
            "@id": "https://precious-jus.com/#entreprise",
            "name": "Precious",
            "alternateName": "Precious Jus",
            "description": "Jus naturels pressés, cocktails et mocktails sans alcool sur mesure pour événements, donuts artisanaux et formations professionnelles, à Montréal.",
            "url": "https://precious-jus.com/",
            "image": "https://precious-jus.com/assets/og-precious.jpg",
            "logo": "https://precious-jus.com/assets/logo.webp",
            "email": "preciousck384@gmail.com",
            "telephone": "+1-514-977-2775",
            "servesCuisine": ["Jus naturels", "Cocktails sans alcool", "Donuts"],
            "priceRange": "$$",
            "areaServed": [
              { "@type": "City", "name": "Montréal" },
              { "@type": "City", "name": "Laval" },
              { "@type": "City", "name": "Longueuil" }
            ],
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Montréal",
              "addressRegion": "QC",
              "addressCountry": "CA"
            },
            "sameAs": [
              "https://www.facebook.com/share/1BwKsN7ovA/",
              "https://www.tiktok.com/@precious100bio"
            ],
            "makesOffer": [
              {
                "@type": "Offer",
                "name": "Service de bar à jus et cocktails événementiels",
                "description": "Carte de cocktails et mocktails sans alcool composée sur mesure, service et mise en scène sur place pour mariages, galas, événements corporatifs, baby showers et réceptions privées."
              },
              {
                "@type": "Offer",
                "name": "Jus naturels pressés",
                "description": "Jus de gingembre, jus vert détox, hibiscus et gingembre, en formats individuels ou événementiels."
              },
              {
                "@type": "Offer",
                "name": "Donuts artisanaux",
                "description": "Boîtes assorties de donuts faits maison, personnalisables selon l'occasion."
              }
            ]
          },
          {
            "@type": "Course",
            "@id": "https://precious-jus.com/#formation-presentiel",
            "name": "Formation jus, cocktails et mocktails — en présentiel",
            "description": "Formation immersive à Montréal : création de cocktails et mocktails originaux, composition d'une carte selon un thème, gestion du matériel, organisation d'une prestation événementielle et création de sa présence en ligne.",
            "url": "https://precious-jus.com/#academie",
            "inLanguage": "fr-CA",
            "provider": { "@id": "https://precious-jus.com/#entreprise" },
            "offers": {
              "@type": "Offer",
              "price": "2000",
              "priceCurrency": "CAD",
              "category": "Paid",
              "url": "https://precious-jus.com/#academie"
            },
            "hasCourseInstance": {
              "@type": "CourseInstance",
              "courseMode": "Onsite",
              "location": {
                "@type": "Place",
                "address": {
                  "@type": "PostalAddress",
                  "addressLocality": "Montréal",
                  "addressRegion": "QC",
                  "addressCountry": "CA"
                }
              }
            }
          },
          {
            "@type": "Course",
            "@id": "https://precious-jus.com/#formation-en-ligne",
            "name": "Formation jus, cocktails et mocktails — en ligne",
            "description": "Formation à distance en création de cocktails et mocktails sans alcool : équilibre des saveurs, composition d'une carte selon un thème, gestion du matériel, organisation d'une prestation et présence en ligne.",
            "url": "https://precious-jus.com/#academie",
            "inLanguage": "fr-CA",
            "provider": { "@id": "https://precious-jus.com/#entreprise" },
            "offers": {
              "@type": "Offer",
              "price": "1500",
              "priceCurrency": "CAD",
              "category": "Paid",
              "url": "https://precious-jus.com/#academie"
            },
            "hasCourseInstance": {
              "@type": "CourseInstance",
              "courseMode": "Online"
            }
          }
        ]
      }
    </script>

    <noscript>
      <style>
        /* Sans JavaScript, les apparitions au scroll ne se déclenchent pas :
           on affiche tout d'emblée plutôt que de laisser la page vide. */
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>

    <div id="root"></div>
